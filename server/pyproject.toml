[project]
name = "servia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "loguru>=0.7",
  "livekit-agents[openai,google,deepgram,cartesia,silero,turn-detector]>=1.8,<2",
  "livekit-api>=0.8",
  "jsonschema>=4.26.0",
  "fastembed>=0.9.0",
  "markdownify>=1.2.3",
  "pgvector>=0.5.1",
  "beautifulsoup4>=4.15.0",
  "redis>=8.1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["model: calls the real language model (skip with -m 'not model')"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
