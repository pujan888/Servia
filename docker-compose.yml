
services:
  postgres:
    build: ./docker/postgres
    image: servia-postgres:16-pgvector
    env_file: ./server/.env
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  api:
    build: ./server
    image: servia:latest
    env_file: ./server/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }

  agent:
    build: ./server
    image: servia:latest
    env_file: ./server/.env
    command: python -m app.voice.worker start
    restart: unless-stopped
    depends_on: [api]

  jobs:
    build: ./server
    image: servia:latest
    env_file: ./server/.env
    command: python -m app.jobs_worker
    restart: unless-stopped
    depends_on: [api]

volumes:
  pgdata:
